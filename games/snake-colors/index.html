<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Snake Colors - Pro</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a0a; font-family: 'Arial Black', sans-serif; }
        canvas { display: block; }
        #menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; transition: background-color 1s ease;
        }
        h1 { font-size: 100px; margin: 0; transition: color 1s ease; text-shadow: 4px 4px 10px rgba(0,0,0,0.8); }
        .btn { 
            padding: 15px 50px; font-size: 24px; cursor: pointer; border: none; 
            border-radius: 50px; font-weight: bold; margin-top: 20px; width: 300px;
            transition: 0.2s; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        #startBtn { background: white; color: black; margin-top: 40px; }
        #mapBtn { background: #333; color: white; }
        .btn:hover { transform: scale(1.05); filter: brightness(1.1); }
        #score { position: absolute; top: 20px; right: 20px; color: white; font-size: 30px; z-index: 5; display: none; }
    </style>
</head>
<body>
    <div id="score">SCORE: 0</div>
    <div id="menu">
        <h1 id="mainTitle">SNAKE COLORS</h1>
        <button id="startBtn" class="btn" onclick="startGame()">START</button>
        <button id="mapBtn" class="btn" onclick="alert('Mapas próximamente...')">ROAD MAP</button>
    </div>
    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const menu = document.getElementById('menu');
const title = document.getElementById('mainTitle');
const scoreEl = document.getElementById('score');

let width, height, headX;
let segments = [], obstacles = [], colorLines = [], particles = [], menuSnakes = [];
let keys = {}, gameRunning = false, score = 0, obstaclesPassed = 0;

const pathWidth = 500;
const moveSpeed = 13;
const gameColors = ['#2ecc71', '#e74c3c', '#3498db', '#f1c40f', '#9b59b6'];
let currentColor = '#2ecc71';
let lastLineColor = '';

// Menú con serpientes de fondo
function updateMenuColors() {
    if(gameRunning) return;
    const theme = gameColors[Math.floor(Date.now()/3000) % gameColors.length];
    title.style.color = theme;
    menu.style.backgroundColor = theme + "66";
    menuSnakes.forEach(s => s.color = theme);
}
setInterval(updateMenuColors, 100);

function createMenuSnakes() {
    menuSnakes = [];
    for(let i=0; i<6; i++) {
        menuSnakes.push({
            x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight,
            speed: 3, angle: Math.random() * Math.PI * 2, history: [], color: '#fff'
        });
    }
}

function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

function startGame() {
    menu.style.display = 'none'; scoreEl.style.display = 'block';
    gameRunning = true; score = 0; obstaclesPassed = 0;
    obstacles = []; colorLines = []; particles = [];
    currentColor = '#2ecc71'; lastLineColor = currentColor;
    resize(); resetSnake();
}

function resetSnake() {
    segments = []; headX = width/2;
    for(let i = 0; i < 70; i++) segments.push({x: headX, y: height * 0.75 + (i * 10)});
}

function createBurst(x, y, color) {
    for(let i=0; i<15; i++) {
        particles.push({
            x, y, vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10,
            size: Math.random() * 6 + 4, life: 1.0, color
        });
    }
}

function update() {
    if (!gameRunning) {
        menuSnakes.forEach(s => {
            s.x += Math.cos(s.angle) * s.speed; s.y += Math.sin(s.angle) * s.speed;
            if(s.x < -100) s.x = width+100; if(s.x > width+100) s.x = -100;
            s.history.unshift({x: s.x, y: s.y}); if(s.history.length > 20) s.history.pop();
        });
        return;
    }
    
    if (keys['ArrowLeft']) headX -= moveSpeed;
    if (keys['ArrowRight']) headX += moveSpeed;
    const limitL = (width - pathWidth) / 2 + 30;
    const limitR = (width + pathWidth) / 2 - 30;
    headX = Math.max(limitL, Math.min(limitR, headX));

    segments.unshift({ x: headX, y: height * 0.75 });
    if (segments.length > 70) segments.pop();

    if (Math.random() < 0.03) obstacles.push({ x: ((width - pathWidth) / 2) + Math.random() * (pathWidth - 70), y: -50 });

    obstacles.forEach((obs, i) => {
        obs.y += 8;
        if (obs.y > height * 0.72 && obs.y < height * 0.78 && headX > obs.x && headX < obs.x + 70) {
            gameRunning = false; menu.style.display = 'flex';
        }
        if (obs.y > height) { 
            obstacles.splice(i, 1); score += 10; obstaclesPassed++;
            if (obstaclesPassed % 8 === 0) {
                let newColor;
                do { newColor = gameColors[Math.floor(Math.random()*gameColors.length)]; } while (newColor === lastLineColor);
                colorLines.push({ y: -150, color: newColor, shakeY: 0 });
                lastLineColor = newColor;
            }
            scoreEl.innerText = "SCORE: " + score;
        }
    });

    colorLines.forEach((line, i) => {
        line.y += 8;
        // TEMBLOR EXAGERADO al tocar la zona de la serpiente
        if (line.y > height * 0.65 && line.y < height * 0.85) {
            line.shakeY = Math.sin(Date.now() * 0.08) * 18; // Frecuencia y amplitud aumentada
            if (line.y > height * 0.74 && line.y < height * 0.76 && currentColor !== line.color) {
                currentColor = line.color;
                createBurst(headX, height * 0.75, currentColor);
            }
        } else {
            line.shakeY = 0;
        }
        if (line.y > height) colorLines.splice(i, 1);
    });

    particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.life -= 0.02;
        if(p.life <= 0) particles.splice(i, 1);
    });
}

function draw() {
    ctx.clearRect(0, 0, width, height);
    if (!gameRunning) {
        menuSnakes.forEach(s => {
            ctx.beginPath(); ctx.strokeStyle = s.color; ctx.lineWidth = 15; ctx.lineCap = 'round';
            if(s.history.length > 0) { ctx.moveTo(s.history.x, s.history.y); s.history.forEach(p => ctx.lineTo(p.x, p.y)); }
            ctx.stroke();
        });
    } else {
        const pathX = (width - pathWidth) / 2;
        ctx.fillStyle = '#1a1a1a'; ctx.fillRect(pathX, 0, pathWidth, height);
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.strokeRect(pathX, -10, pathWidth, height + 20);

        colorLines.forEach(l => {
            ctx.fillStyle = l.color;
            ctx.fillRect(pathX, l.y + l.shakeY, pathWidth, 50); // Más gorda (50px)
        });

        ctx.fillStyle = 'white'; obstacles.forEach(o => ctx.fillRect(o.x, o.y, 70, 35));

        particles.forEach(p => {
            ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
        });

        // Serpiente con cara
        ctx.beginPath(); ctx.lineWidth = 20; ctx.strokeStyle = currentColor; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.moveTo(segments.x, segments.y);
        for (let i = 1; i < segments.length; i++) ctx.lineTo(segments[i].x, segments[i].y + (i * 4));
        ctx.stroke();

        const h = segments;
        ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(h.x-8, h.y-6, 8, 0, 7); ctx.arc(h.x+8, h.y-6, 8, 0, 7); ctx.fill();
        ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(h.x-8, h.y-10, 4, 0, 7); ctx.arc(h.x+8, h.y-10, 4, 0, 7); ctx.fill();
        ctx.strokeStyle = '#ff4757'; ctx.lineWidth = 4;
        let t = Math.sin(Date.now()/120)*10;
        ctx.beginPath(); ctx.moveTo(h.x, h.y-12); ctx.lineTo(h.x, h.y-25-t); 
        ctx.lineTo(h.x-6, h.y-32-t); ctx.moveTo(h.x, h.y-25-t); ctx.lineTo(h.x+6, h.y-32-t); ctx.stroke();
    }
    update();
    requestAnimationFrame(draw);
}
resize(); createMenuSnakes(); draw();
</script>
</body>
</html>
