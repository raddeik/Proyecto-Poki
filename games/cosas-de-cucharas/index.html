<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cosa de Cucharas: Casino & Prestige Edition</title>
    <style>
        :root {
            --bg: #020202; --panel: #0a0a0a; --accent: #3498db;
            --gold: #f1c40f; --danger: #ff4757; --text: #eee; --purple: #a55eea; --godly: #e84393; --green: #2ecc71;
        }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; user-select: none; }

        #loading-screen {
            position: fixed; inset: 0; background: #000; z-index: 5000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #loading-spoon { font-size: 150px; animation: colorShift 3s infinite linear; }
        @keyframes colorShift {
            0% { color: #ff4757; filter: drop-shadow(0 0 20px #ff4757); }
            33% { color: #3498db; filter: drop-shadow(0 0 20px #3498db); }
            66% { color: #2ecc71; filter: drop-shadow(0 0 20px #2ecc71); }
            100% { color: #ff4757; filter: drop-shadow(0 0 20px #ff4757); }
        }
        .play-btn { margin-top: 40px; padding: 15px 50px; font-size: 24px; font-weight: 900; background: var(--accent); color: white; border: none; border-radius: 50px; cursor: pointer; transition: 0.3s; }
        .play-btn:hover { transform: scale(1.1); box-shadow: 0 0 20px var(--accent); }

        #settings-btn { position: fixed; top: 20px; left: 20px; font-size: 30px; cursor: pointer; z-index: 5100; transition: 0.3s; opacity: 0.7; }
        #settings-menu { position: fixed; top: 70px; left: 20px; background: #111; border: 1px solid #333; padding: 15px; border-radius: 10px; display: none; z-index: 5100; min-width: 150px; }
        .lang-option { padding: 10px; cursor: pointer; border-radius: 5px; transition: 0.2s; }
        .lang-option:hover { background: #333; }

        .sidebar { width: 320px; background: var(--panel); border: 1px solid #1a1a1a; display: flex; flex-direction: column; padding: 12px; z-index: 10; }

        .accordion {
            background: #111;
            border: 1px solid #222;
            border-radius: 10px;
            margin-bottom: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 260px;
        }
        .accordion summary {
            cursor: pointer;
            padding: 12px;
            font-weight: bold;
            list-style: none;
            color: #eee;
            background: #151515;
            text-transform: uppercase;
            flex: 0 0 auto;
        }
        .accordion summary::-webkit-details-marker { display: none; }
        .accordion[open] summary { background: var(--accent); color: white; }
        .accordion .item-list {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 10px;
            max-height: 200px;
        }

        #achievements-list { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; border-bottom: 1px solid #222; margin-bottom: 10px; min-height: 60px; scrollbar-width: none; }
        .achievement { min-width: 38px; height: 38px; border-radius: 50%; background: #111; display: flex; align-items: center; justify-content: center; filter: grayscale(1); opacity: 0.1; transition: 0.8s; font-size: 20px; border: 1px solid #222; }
        .achievement.unlocked { filter: grayscale(0); opacity: 1; border: 2px solid var(--gold); box-shadow: 0 0 15px var(--gold); }

        .main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; background: radial-gradient(circle, #0f0f0f 0%, #000 100%); }
        #spoon-btn { font-size: 140px; cursor: pointer; border: none; background: none; outline: none; transition: 0.2s; z-index: 5; }
        #spoon-btn:active { transform: scale(0.8); }
        #cucharas-val { font-size: 2.8rem; font-weight: 900; color: white; margin: 0; font-family: 'Courier New', monospace; }
        #rank-label { color: var(--gold); font-weight: bold; letter-spacing: 4px; font-size: 12px; margin-top: 8px; }

        #overheat-msg { color: var(--danger); font-weight: 900; visibility: hidden; text-shadow: 0 0 15px var(--danger); margin-bottom: 5px; font-size: 14px; }
        #minigame-master-btn { margin-top: 20px; padding: 14px 35px; background: linear-gradient(45deg, var(--purple), var(--godly)); border: none; color: white; font-weight: 900; border-radius: 50px; cursor: pointer; text-transform: uppercase; }
        #minigame-master-btn:disabled { opacity: 0.3; filter: grayscale(1); }

        #plinko-board { width: 340px; height: 480px; background: #000; position: relative; border: 2px solid #1a1a1a; border-radius: 10px; margin: 10px 0; overflow: hidden; }
        .peg { position: absolute; width: 4px; height: 4px; background: #333; border-radius: 50%; }
        .ball { position: absolute; width: 8px; height: 8px; background: var(--gold); border-radius: 50%; box-shadow: 0 0 10px var(--gold); z-index: 10; transition: all 0.08s linear; }
        .bucket { position: absolute; bottom: 0; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: bold; border-top: 1px solid #222; }
        .bucket-gold { background: linear-gradient(to top, rgba(241, 196, 15, 0.3), transparent); color: var(--gold) !important; box-shadow: inset 0 0 15px var(--gold); }

        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .modal-box { background: #080808; padding: 30px; border-radius: 20px; border: 1px solid #222; text-align: center; width: 350px; }
        .bet-btn { width: 100%; padding: 12px; margin: 6px 0; border-radius: 8px; border: 1px solid #333; background: #111; color: #fff; cursor: pointer; font-weight: bold; }
        .item-list button { width: 100%; text-align: left; padding: 12px; margin-bottom: 8px; border: 1px solid #1a1a1a; border-radius: 8px; background: #0d0d0d; color: #888; cursor: pointer; position: relative; }
        .item-list button:disabled { opacity: 0.1; }
        .price { color: var(--gold); font-weight: bold; display: block; font-size: 0.9rem; }
        .bonus { color: var(--green); font-size: 0.75rem; font-weight: bold; display: block; margin-top: 4px; }
        .particle { position: absolute; pointer-events: none; animation: fly 0.6s forwards; font-size: 24px; }
        @keyframes fly { 0% { opacity:1; } 100% { transform: translate(var(--x), var(--y)) rotate(360deg); opacity:0; } }
        .overheat { animation: shake 0.1s infinite; color: #ff3333 !important; }
        @keyframes shake { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(2px, 2px); } }
    </style>
</head>

        // FUNCIÓN PARA FORMATEAR NÚMEROS CON ABREVIATURAS
        function formatNumber(num) {
            if (num < 1000) return Math.floor(num).toString();
            
            const suffixes = [
                { div: 1000, suf: 'K' },
                { div: 1000000, suf: 'M' },
                { div: 1000000000, suf: 'B' },
                { div: 1000000000000, suf: 'T' },
                { div: 1000000000000000, suf: 'Q' },
                { div: 1000000000000000000, suf: 'Qi' },
                { div: 1000000000000000000000, suf: 'Sx' }
            ];
            
            for (let i = 0; i < suffixes.length; i++) {
                if (num >= suffixes[i].div) {
                    return (num / suffixes[i].div).toFixed(1).replace(/\.0$/, '') + suffixes[i].suf;
                }
            }
            return num.toString();

            let cant = prompt("¿Cuánto quieres apostar? (Tienes: " + formatNumber(Math.floor(state.cucharas)) + ")");
            cant = parseInt(cant);
            if (isNaN(cant) || cant <= 0 || cant > state.cucharas) { alert("Cantidad no válida."); return; }
            state.cucharas -= cant;
            let prob = Math.random();
            let gano = false;
            let premio = 0;
            let msg = "";
            if (tipo === 'moneda' && prob < 0.5) { gano = true; premio = cant * 2; msg = "x2"; }
            else if (tipo === 'dados' && prob < 0.33) { gano = true; premio = cant * 3; msg = "x3"; }
            else if (tipo === 'slots' && prob < 0.05) { gano = true; premio = cant * 10; msg = "x10"; }
            else if (tipo === 'rusa' && prob < 0.15) { gano = true; premio = cant * 50; msg = "x50"; }
            if (gano) { state.cucharas += premio; alert("¡GANASTE " + msg + "! +" + formatNumber(premio) + " 🥄"); }
            else { alert("Perdiste la apuesta..."); }
            updateUI(); save();
        }

        const getMinBet = () => Math.max(100, Math.floor(state.totalHistorico * 0.1));

        function initPlinko() {
            const b = document.getElementById('plinko-board');
            b.innerHTML = '';
            for (let r = 0; r < 14; r++) {
                for (let i = 0; i <= r; i++) {
                    const p = document.createElement('div');
                    p.className = 'peg';
                    p.style.top = (30 + r * 28) + 'px';
                    p.style.left = (170 - (r * 10) + (i * 20)) + 'px';
                    b.appendChild(p);
                }
            }
            const mults = [100, 50, 10, 5, 1, 0.5, 0.1, "JACKPOT", "JACKPOT", 0.1, 0.5, 1, 5, 10, 50, 100];
            mults.forEach((m, i) => {
                const bu = document.createElement('div');
                bu.className = 'bucket';
                if (m === "JACKPOT") bu.classList.add('bucket-gold');
                bu.style.width = (340 / 16) + 'px';
                bu.style.left = (i * (340 / 16)) + 'px';
                bu.innerText = m === "JACKPOT" ? "90%" : "x" + m;
                b.appendChild(bu);
            });
        }

        function dropPlinko(p) {
            const bet = Math.floor(state.cucharas * p);
            state.cucharas -= bet;
            const ball = document.createElement('div');
            ball.className = 'ball';
            ball.style.top = '10px';
            ball.style.left = '166px';
            document.getElementById('plinko-board').appendChild(ball);
            let r = 0, l = 166;
            const iv = setInterval(() => {
                r++;
                l += (Math.random() > 0.51 ? 10 : -10);
                ball.style.top = (30 + r * 28 - 12) + 'px';
                ball.style.left = l + 'px';
                if (r >= 14) {
                    clearInterval(iv);
                    const idx = Math.floor(l / (340 / 16));
                    const mults = [100, 50, 10, 5, 1, 0.5, 0.1, "JACKPOT", "JACKPOT", 0.1, 0.5, 1, 5, 10, 50, 100];
                    const res = mults[Math.min(15, Math.max(0, idx))];
                    if (res === "JACKPOT") {
                        let bonus = Math.floor(state.cucharas * 0.9);
                        state.cucharas += bonus;
                        alert(i18n[state.lang].jackpot + " +" + formatNumber(bonus));
                    } else {
                        let win = Math.floor(bet * res);
                        state.cucharas += win;
                        alert("x" + res + "! = " + formatNumber(win));
                    }
                    ball.remove();
                    updateUI();
                    save();
                }
            }, 80);
        }

        function startSkillGame() {
            const overlay = document.getElementById('mg-overlay');
            const canvas = document.getElementById('mg-canvas');
            overlay.style.display = 'flex';
            canvas.innerHTML = '';

            const games = ['click', 'reflex', 'lucky'];
            const game = games[Math.floor(Math.random() * games.length)];
            let timeLeft = 5;
            let finished = false;

            document.getElementById('mg-timer').innerText = timeLeft;

            const finish = (win) => {
                if (finished) return;
                finished = true;
                clearInterval(clock);
                overlay.style.display = 'none';

                const bet = Math.floor(state.cucharas * 0.2);
                if (win) { state.cucharas += bet; alert("OK!"); }
                else { state.cucharas -= bet; alert("NO!"); }
                updateUI();
                save();
            };

            if (game === 'click') {
                document.getElementById('mg-title').innerText = "CLICK!";
                let c = 0;
                const t = document.createElement('div');
                t.className = 'ball';
                t.style.width = "40px";
                t.style.height = "40px";
                t.style.top = '125px';
                t.style.left = '125px';
                t.style.cursor = "pointer";
                t.onclick = () => {
                    if (finished) return;
                    c++;
                    t.style.top = Math.random() * 250 + 'px';
                    t.style.left = Math.random() * 250 + 'px';
                    if (c >= 12) finish(true);
                };
                canvas.appendChild(t);
            } else if (game === 'reflex') {
                document.getElementById('mg-title').innerText = "!!!";
                const t = document.createElement('div');
                t.className = 'ball';
                t.style.width = "60px";
                t.style.height = "60px";
                t.style.top = '120px';
                t.style.left = '120px';
                t.style.background = "#222";
                canvas.appendChild(t);
                setTimeout(() => {
                    if (finished) return;
                    t.style.background = "#2ecc71";
                    t.style.cursor = "pointer";
                    t.onclick = () => finish(true);
                }, 1200 + Math.random() * 2500);
            } else {
                document.getElementById('mg-title').innerText = "? ? ?";
                for (let i = 0; i < 4; i++) {
                    const btn = document.createElement('div');
                    btn.className = 'ball';
                    btn.style.width = "40px";
                    btn.style.height = "40px";
                    btn.style.top = (20 + i * 70) + 'px';
                    btn.style.left = '130px';
                    btn.style.cursor = "pointer";
                    btn.onclick = () => finish(Math.random() > 0.75);
                    canvas.appendChild(btn);
                }
            }

            const clock = setInterval(() => {
                if (finished) return;
                timeLeft--;
                document.getElementById('mg-timer').innerText = timeLeft;
                if (timeLeft <= 0) finish(false);
            }, 1000);
        }

        function buy(cat, idx) {
            const item = db[cat][idx];
            if (!item) return;
            const countKey = cat + '_' + item.n;
            const count = state.counts[countKey] || 0;
            const price = Math.floor(item.p * Math.pow(1.5, count));

            if (state.cucharas >= price) {
                state.cucharas -= price;
                state.counts[countKey] = count + 1;

                if (cat === 'Materiales') {
                    state.cp += item.m;
                    state.matLevel++;
                    item.bought = true;
                } else if (cat === 'Click') {
                    state.cp += item.cp || 0;
                } else if (cat === 'Ingredientes') {
                    state.multi += item.mul;
                } else if (cat === 'Comida') {
                    state.cp += item.cp;
                } else {
                    if (item.a) state.auto += item.a;
                    if (item.mult) state.multi += item.mult;
                }

                renderTabs();
                updateUI();
                save();
            }
        }

        function buyRenacimiento(idx) {
            const item = db.Renacimiento[idx];
            if (state.cucharas < item.p) return;
            if (!confirm(i18n[state.lang].prestigeConfirm)) return;

            state.cucharas = 0;
            state.auto = 0;
            state.cp = 1;
            state.multi = 1.0;
            state.matLevel = 0;
            state.heat = 0;
            state.counts = {};
            db.Materiales = JSON.parse(JSON.stringify(baseMateriales));

            state.prestigioMult = item.m;
            state.rankName = (i18n[state.lang].items[item.n] || item.n).toUpperCase();

            renderTabs();
            updateUI();
            save();
        }

        setInterval(() => {
            if (state.clicks > 12) state.heat = Math.min(100, state.heat + 10);
            else state.heat = Math.max(0, state.heat - 5);

            const s = document.getElementById('spoon-btn');
            s.style.filter = `drop-shadow(0 0 ${state.heat / 3}px #f00)`;
            s.classList.toggle('overheat', state.heat > 50);
            document.getElementById('overheat-msg').style.visibility = state.heat > 50 ? 'visible' : 'hidden';

            if (state.heat >= 100) {
                state.cucharas = Math.floor(state.cucharas * 0.9);
                state.heat = 0;
                alert(i18n[state.lang].melted);
            }
            state.clicks = 0;
        }, 1000);

        setInterval(() => {
            let g = (state.auto * state.multi * state.prestigioMult);
            state.cucharas += g;
            state.totalHistorico += g;
            updateUI();

            const min = getMinBet();
            document.getElementById('min-bet-val').innerText = formatNumber(min);
            document.getElementById('minigame-master-btn').disabled = (state.cucharas < min);
        }, 1000);

        function updateUI() {
            document.getElementById('cucharas-val').innerText = formatNumber(Math.floor(state.cucharas));
            document.getElementById('auto-val').innerText = formatNumber((state.auto * state.multi * state.prestigioMult * 10) / 10);
            document.getElementById('cp-val').innerText = formatNumber((state.cp * state.multi * state.prestigioMult * 10) / 10);
            document.getElementById('mult-val').innerText = state.multi.toFixed(2);
            document.getElementById('rank-label').innerText = `RANGO: ${state.rankName}`;
            document.getElementById('material-label').innerText = i18n[state.lang].mats[Math.min(6, state.matLevel)];
        }

        function renderTabs() {
            const draw = (id, cat) => {
                const list = document.getElementById(id);
                if (!list) return;
                list.innerHTML = '';

                if (cat === 'Renacimiento') {
                    db[cat].forEach((item, i) => {
                        const btn = document.createElement('button');
                        btn.disabled = state.cucharas < item.p;
                        const name = i18n[state.lang].items[item.n] || item.n;
                        btn.innerHTML = `<strong>${name}</strong> <span class="price">💰 ${formatNumber(item.p)}</span><span class="bonus">x${item.m} PRESTIGE</span>`;
                        btn.onclick = () => buyRenacimiento(i);
                        list.appendChild(btn);
                    });
                    return;
                }

                db[cat].forEach((item, i) => {
                    if (cat === 'Materiales' && item.bought) return;

                    const countKey = cat + '_' + item.n;
                    const count = state.counts[countKey] || 0;
                    const price = Math.floor(item.p * Math.pow(1.5, count));

                    const btn = document.createElement('button');
                    btn.disabled = state.cucharas < price;
                    btn.onclick = () => buy(cat, i);

                    const name = i18n[state.lang].items[item.n] || item.n;

                    let extra = '';
                    if (cat === 'Click' || cat === 'Comida') extra = `+${formatNumber(item.cp)} clic`;
                    else if (cat === 'Ingredientes') extra = `+${(item.mul * 100).toFixed(0)}% multi`;
                    else if (item.a) extra = `+${formatNumber(item.a)} auto/s`;
                    else if (item.mult) extra = `+${(item.mult * 100).toFixed(0)}% multi`;
                    else if (cat === 'Materiales') extra = `+${formatNumber(item.m)} clic`;

                    btn.innerHTML = `<strong>${name} (${count})</strong> <span class="price">💰 ${formatNumber(price)}</span><span class="bonus">${extra}</span>`;
                    list.appendChild(btn);
                });
            };

            draw('list-izq-Click', 'Click');
            draw('list-izq-Personal', 'Personal');
            draw('list-izq-Industrial', 'Industrial');
            draw('list-izq-Materiales', 'Materiales');

            draw('list-der-Ingredientes', 'Ingredientes');
            draw('list-der-Comida', 'Comida');
            draw('list-der-Renacimiento', 'Renacimiento');
        }

        function save() { localStorage.setItem('spoon_ultimate_save_v2', JSON.stringify(state)); }

        function load() {
            const s = localStorage.getItem('spoon_ultimate_save_v2');
            if (s) {
                const loaded = JSON.parse(s);
                state = { ...state, ...loaded };
                db.Materiales = JSON.parse(JSON.stringify(baseMateriales));
            }
            changeLang(state.lang || 'es');
            renderTabs();
            updateUI();
        }

        function resetGame() {
            if (confirm("¿Borrar TODO el progreso? (incluye prestige)")) {
                localStorage.clear();
                location.reload();
            }
        }

        window.onload = load;
    </script>
</body>
</html>
