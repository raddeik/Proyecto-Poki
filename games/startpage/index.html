<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UdP5 10. ÁNGULOS (CLASIFICACIÓN) | TopWorksheets</title>
    <style>
        *{box-sizing:border-box}body{font-family:Arial,sans-serif;max-width:1200px;margin:0 auto;padding:20px;background:linear-gradient(135deg,#f5f5f5,#e8e8e8);color:#333;min-height:100vh}
        .search-container{text-align:center;margin:50px auto;background:linear-gradient(145deg,rgba(255,255,255,0.95),rgba(248,250,252,0.8));padding:40px;border-radius:25px;box-shadow:0 15px 50px rgba(0,0,0,0.15);max-width:800px}
        .logo{margin-bottom:20px}
        .logo h1{font-size:2.5em;color:#1a73e8;margin:0;text-shadow:0 2px 10px rgba(26,115,232,0.3);font-weight:400}
        .search-box{width:75%;max-width:550px;padding:18px 25px;font-size:18px;border:2px solid #dadce0;border-radius:30px;outline:none;box-shadow:0 3px 15px rgba(0,0,0,0.1);transition:all .3s;font-family:Arial,sans-serif}
        .search-box:focus{border-color:#1a73e8;box-shadow:0 0 0 3px rgba(26,115,232,0.1),0 3px 20px rgba(0,0,0,0.15)}
        .search-btn{padding:18px 35px;font-size:18px;background:linear-gradient(45deg,#1a73e8,#4285f4);color:#fff;border:none;border-radius:30px;cursor:pointer;margin-left:15px;box-shadow:0 4px 20px rgba(26,115,232,0.4);transition:all .3s;font-weight:500;font-family:Arial,sans-serif;position:relative;overflow:hidden}
        .search-btn:hover{transform:translateY(-2px);box-shadow:0 6px 25px rgba(26,115,232,0.5)}
        .search-btn:active{transform:translateY(0)}
        .results{margin:30px auto 0;background:#fff;border-radius:20px;padding:30px;box-shadow:0 10px 40px rgba(0,0,0,0.1);max-height:65vh;overflow-y:auto;display:none;max-width:800px}
        .result-item{margin:25px 0;padding:25px;border-left:5px solid #1a73e8;background:#f8faff;border-radius:15px;transition:all .25s;cursor:pointer;position:relative}
        .result-item:hover{transform:translateX(8px);box-shadow:0 8px 30px rgba(0,0,0,0.12)}
        .result-title{font-size:22px;font-weight:600;margin-bottom:12px;color:#1a0dab;line-height:1.3}
        .result-url{color:#1a73e8;font-size:16px;margin-bottom:12px;font-family:'Courier New',monospace;font-weight:500}
        .result-snippet{color:#545454;line-height:1.6;font-size:15px}
        .result-num{font-size:18px;color:#4285f4;font-weight:bold;margin-right:10px}
        .search-stats{margin-top:15px;color:#5f6368;font-size:14px;font-style:italic}
        .section{background:rgba(255,255,255,0.8);margin:40px auto;padding:30px;border-radius:20px;box-shadow:0 5px 25px rgba(0,0,0,0.08);max-width:800px}
        .topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px;margin-top:20px}
        .topic-btn{padding:12px 20px;background:#e8f0fe;border:2px solid #4285f4;border-radius:20px;cursor:pointer;font-weight:500;transition:all .2s;color:#1a73e8}
        .topic-btn:hover{background:#4285f4;color:#fff;transform:scale(1.05)}
        @media (max-width:768px){.search-box{width:92%;margin-bottom:15px}.search-btn{margin-left:0;width:92%;margin-top:10px}.logo h1{font-size:2em}}
    </style>
</head>
<body>
    <div class="search-container">
        <div class="logo">
            <h1>🔍 Startpage Privado</h1>
            <p style="color:#5f6368;margin:5px 0 25px;font-size:16px">Enlaces reales • Anti-bloqueadores • Funciona al 100%</p>
        </div>
        <input type="text" class="search-box" id="searchInput" placeholder="Busca: html, css, javascript, react, python, vue..." autocomplete="off">
        <button class="search-btn" onclick="buscar()" id="btnBuscar">🔍 Buscar</button>
        <div id="resultados" class="results"></div>
    </div>

    <div class="section">
        <h2 style="text-align:center;margin-bottom:25px">🚀 Temas populares (clic para buscar)</h2>
        <div class="topics">
            <button class="topic-btn" onclick="buscarTermino('html')">HTML</button>
            <button class="topic-btn" onclick="buscarTermino('css')">CSS</button>
            <button class="topic-btn" onclick="buscarTermino('javascript')">JavaScript</button>
            <button class="topic-btn" onclick="buscarTermino('react')">React</button>
            <button class="topic-btn" onclick="buscarTermino('python')">Python</button>
            <button class="topic-btn" onclick="buscarTermino('vue')">Vue.js</button>
        </div>
    </div>

    <script>
        var datosBusqueda={
            html:[
                {titulo:'HTML Interactivo - W3Schools',url:'https://www.w3schools.com/html/',snippet:'Tutorial práctico con editor online. Copia/pega ejemplos.'},
                {titulo:'HTML5 Docs Oficial - MDN',url:'https://developer.mozilla.org/es/docs/Web/HTML',snippet:'Referencia completa HTML5. Elementos + atributos.'},
                {titulo:'Curso HTML Gratis - freeCodeCamp',url:'https://www.freecodecamp.org/espanol/news/aprende-las-bases-de-html-para-principiantes-en-solo-15-minutos/',snippet:'15min basics + 300h práctica. Certificado incluido.'},
                {titulo:'Google HTML Course',url:'https://developers.google.com/profile/badges/playlists/webdev/learn-html?hl=es-419',snippet:'Curso oficial Google con insignia digital.'}
            ],
            css:[
                {titulo:'CSS3 Completo - W3Schools',url:'https://www.w3schools.com/css/',snippet:'Flexbox • Grid • Animations • Responsive. Editor live.'},
                {titulo:'Curso CSS Gratis',url:'https://aprendergratis.es/cursos-online/curso-css-disenar-webs/',snippet:'7+ horas video. Diseño web real.'},
                {titulo:'Flexbox Froggy Game',url:'https://flexboxfroggy.com/',snippet:'Aprende Flexbox jugando. 24 niveles gratis.'},
                {titulo:'CSS Grid Garden',url:'https://cssgridgarden.com/',snippet:'Juego CSS Grid. Niveles prácticos.'}
            ],
            javascript:[
                {titulo:'JavaScript Moderno',url:'https://es.javascript.info',snippet:'ES6+ completo. Async • Modules • DOM.'},
                {titulo:'Curso JS 2025 Español',url:'https://www.youtube.com/watch?v=0yzBXxRLadM',snippet:'3h desde cero por Victor Robles.'},
                {titulo:'Eloquent JavaScript',url:'https://eloquentjavascript.net/',snippet:'Libro gratis funcional + OOP.'},
                {titulo:'MDN JS Guide',url:'https://developer.mozilla.org/es/docs/Web/JavaScript/Guide',snippet:'Guía oficial Mozilla.'}
            ],
            react:[
                {titulo:'React Official 18+',url:'https://react.dev/learn',snippet:'Tutorial interactivo oficial. Hooks incluidos.'},
                {titulo:'React 2025 Español',url:'https://www.youtube.com/watch?v=BisJdN2LWEY',snippet:'2h curso completo Victor Robles.'},
                {titulo:'React IA 2026 - EDteam',url:'https://ed.team/cursos/react',snippet:'Hooks • APIs • Rutas. Gratis inicial.'},
                {titulo:'React Patterns Pro',url:'https://kentcdodds.com/blog/javascript-to-know-react',snippet:'Custom Hooks • Context • Performance.'}
            ],
            python:[
                {titulo:'Python Completo Gratis',url:'https://www.youtube.com/watch?v=0ftxmhe323g',snippet:'Curso principiantes A2Capacitacion.'},
                {titulo:'Python Tutorial Español',url:'https://j2logo.com/python/tutorial/',snippet:'Guía paso a paso desde cero.'},
                {titulo:'Python Docs Oficial ES',url:'https://docs.python.org/es/3/tutorial/',snippet:'Documentación oficial Python 3.12.'},
                {titulo:'Automate con Python',url:'https://automatetheboringstuff.com/',snippet:'Libro gratis automatización.'}
            ],
            vue:[
                {titulo:'Vue.js Official Guide',url:'https://es.vuejs.org/guide/introduction.html',snippet:'Guía oficial Vue 3. Composition API.'},
                {titulo:'Vue Mastery Cursos',url:'https://www.vuemastery.com/courses/intro-to-vue-3/',snippet:'Cursos Vue 3 interactivos.'},
                {titulo:'Vue Tutorial Español',url:'https://www.youtube.com/watch?v=nhB1PHX4cuo',snippet:'Curso Vue.js completo español.'}
            ]
        };
        
        function buscar(){
            var q=document.getElementById('searchInput').value.trim().toLowerCase();
            mostrarResultados(q||'html');
        }
        
        function buscarTermino(termino){
            document.getElementById('searchInput').value=termino;
            mostrarResultados(termino);
        }
        
        function mostrarResultados(q){
            var resultados=datosBusqueda[q]||resultadosGenericos(q);
            var contenedor=document.getElementById('resultados');
            contenedor.innerHTML='<h3 style="margin:0 0 25px 0;color:#202124;font-size:24px;font-weight:400">Resultados para <strong>"'+q.toUpperCase()+'"</strong> <span class="search-stats">( '+resultados.length+' resultados • '+Math.floor(Math.random()*800+200)+'ms )</span></h3>'+
            resultados.map(function(r,i){
                return '<div class="result-item" onclick="window.open(\''+r.url+'\',\'_blank\')"><span class="result-num">'+(i+1)+'</span><div class="result-title">'+r.titulo+'</div><div class="result-url">'+r.url+'</div><div class="result-snippet">'+r.snippet+'</div></div>';
            }).join('');
            contenedor.style.display='block';
            contenedor.scrollIntoView({behavior:'smooth'});
        }
        
        function resultadosGenericos(q){
            var Q=q.charAt(0).toUpperCase()+q.slice(1);
            return [
                {titulo:'Tutorial '+Q+' Español 2026',url:'https://www.youtube.com/results?search_query=tutorial+'+Q+'+espa%C3%B1ol+2026',snippet:'Mejores videos YouTube actualizados.'},
                {titulo:Q+' Documentación',url:'https://developer.mozilla.org/es/search?q='+Q,snippet:'Guía oficial MDN '+Q+'.'},
                {titulo:'Curso Gratis '+Q, url:'https://platzi.com/search/?q='+Q,snippet:'Cursos Platzi y freeCodeCamp.'}
            ];
        }
        
        document.getElementById('searchInput').onkeypress=function(e){if(e.keyCode===13)buscar();};
        document.getElementById('searchInput').focus();
        document.getElementById('btnBuscar').onmouseover=function(){this.style.background='linear-gradient(45deg,#0d5fcc,#3367d6)'};
        document.getElementById('btnBuscar').onmouseout=function(){this.style.background='linear-gradient(45deg,#1a73e8,#4285f4)'};
        
        // BUSQUEDA INICIAL
        buscarTermino('html');
    </script>
</body>
</html>
