<!DOCTYPE html>
<html>
<head>
  <title>Flappy Simple</title>
  <style>
    body {
      margin: 0;
      background: skyblue;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    canvas {
      background: white;
      border: 2px solid black;
    }
  </style>
</head>
<body>

<canvas id="game" width="300" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let y = 150;
let velocity = 0;
let gravity = 0.5;

// salto
document.addEventListener("keydown", () => {
  velocity = -8;
});

function loop() {
  velocity += gravity;
  y += velocity;

  // límites
  if (y > 360) {
    y = 360;
    velocity = 0;
  }

  if (y < 0) {
    y = 0;
    velocity = 0;
  }

  ctx.clearRect(0, 0, 300, 400);

  ctx.fillStyle = "red";
  ctx.fillRect(130, y, 30, 30);

  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
