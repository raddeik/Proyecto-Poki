<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>UdP2 4. Multiplicación de monomio | TopWorksheets</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Courier New', monospace; margin: 0; overflow: hidden; user-select: none; }
        
        #game-view { position: relative; width: 100vw; height: 100vh; background: #050505; }

        /* --- OFICINA --- */
        #office { 
            position: absolute; width: 100%; height: 100%; 
            background: radial-gradient(circle, #222 0%, #000 100%);
            display: flex; align-items: center; justify-content: center;
        }

        #door { 
            position: absolute; top: 0; width: 100%; height: 100%; 
            background: linear-gradient(to bottom, #444 5%, #111 50%, #444 95%);
            background-size: 100% 40px; border-bottom: 20px solid #222;
            transition: transform 0.4s ease-in; z-index: 10;
        }
        .door-open { transform: translateY(-100%); }

        /* --- TABLETA (MONITOR) --- */
        #tablet { 
            position: absolute; bottom: -100%; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 50; transition: bottom 0.3s ease-out;
            border: 20px solid #222; box-sizing: border-box;
        }
        #tablet.up { bottom: 0; }

        #cam-feed { width: 100%; height: 100%; position: relative; overflow: hidden; }
        .static { position: absolute; width: 100%; height: 100%; background: url('https://giphy.com'); opacity: 0.08; pointer-events: none; z-index: 100; }
        
        /* --- MAPA Y BOTONES DE CÁMARA --- */
        #map { position: absolute; bottom: 50px; right: 50px; width: 250px; height: 200px; background: rgba(0,0,0,0.8); border: 2px solid #fff; z-index: 110; }
        .cam-btn { 
            position: absolute; width: 50px; height: 30px; background: #333; color: #fff; 
            border: 1px solid #fff; cursor: pointer; font-size: 10px; 
        }
        .cam-btn.active { background: #0f0; color: #000; }

        /* --- HUD ESTILO FNAF --- */
        #hud { position: absolute; bottom: 20px; left: 20px; z-index: 60; pointer-events: none; }
        .power-bar { display: flex; gap: 5px; margin-top: 5px; }
        .usage-block { width: 15px; height: 20px; background: #0f0; }

        #clock { position: absolute; top: 20px; right: 20px; font-size: 35px; }

        /* --- INTERRUPTOR DE TABLETA (LA BARRA VERDE) --- */
        #tablet-trigger { 
            position: absolute; bottom: 0; left: 25%; width: 50%; height: 40px; 
            background: rgba(0, 255, 0, 0.2); border: 2px solid #0f0; 
            z-index: 200; cursor: pointer; text-align: center; line-height: 40px;
            transition: 0.2s; opacity: 0.5;
        }
        #tablet-trigger:hover { opacity: 1; background: rgba(0, 255, 0, 0.4); }

        /* --- BOTÓN DE PUERTA (EN LA OFICINA) --- */
        #door-switch {
            position: absolute; left: 50px; top: 50%; width: 60px; height: 100px;
            background: #444; border: 4px solid #222; z-index: 20; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: space-around;
        }
        .light-btn { width: 40px; height: 30px; background: #fff; border-radius: 5px; }
        .door-btn-ui { width: 40px; height: 30px; background: #800; border-radius: 5px; }
        .door-btn-ui.active { background: #f00; box-shadow: 0 0 10px #f00; }

        #pilot-scare { position: absolute; font-size: 200px; z-index: 5; opacity: 0; }
    </style>
</head>
<body>

    <div id="game-view">
        <!-- OFICINA -->
        <div id="office">
            <div id="door" class="door-open"></div>
            <div id="door-switch" onclick="toggleDoor()">
                <div class="light-btn"></div>
                <div id="door-led" class="door-btn-ui"></div>
            </div>
            <div id="pilot-scare">👤</div>
            <div style="font-size: 150px; filter: brightness(0.1);">🏎️</div>
        </div>

        <!-- MONITOR TABLETA -->
        <div id="tablet">
            <div id="cam-feed">
                <div class="static"></div>
                <div id="cam-name" style="position:absolute; top:30px; left:30px; font-size:24px; text-shadow: 2px 2px #000;">CAM 1: PIT LANE</div>
                <div id="pilot-cam" style="position:absolute; font-size:100px; opacity:0;">🏎️</div>
                
                <div id="map">
                    <div style="padding:10px; font-size:12px;">CIRCUIT MAP</div>
                    <button class="cam-btn active" style="top:20px; left:20px;" onclick="setCam(1, this)">CAM 1</button>
                    <button class="cam-btn" style="top:70px; left:120px;" onclick="setCam(2, this)">CAM 2</button>
                    <button class="cam-btn" style="bottom:20px; left:50px;" onclick="setCam(3, this)">CAM 3</button>
                </div>
            </div>
        </div>

        <!-- HUD -->
        <div id="hud">
            <div>Power left: <span id="power-val">100</span>%</div>
            <div style="display:flex; align-items:center; gap:10px;">
                Usage: <div class="power-bar" id="usage-bar"><div class="usage-block"></div></div>
            </div>
        </div>

        <div id="clock">12 PM</div>

        <!-- TRIGGER DE TABLETA -->
        <div id="tablet-trigger" onmouseover="toggleTablet()">▼ MONITOR ▼</div>
    </div>

    <script>
        let power = 100, hour = 0, gameActive = true;
        let doorClosed = false, tabletUp = false, currentCam = 1;
        let pilotPos = 0; // 0 a 4 (4 es muerte)

        // Consumo de Energía
        setInterval(() => {
            if (!gameActive) return;
            let usage = 1;
            if (doorClosed) usage++;
            if (tabletUp) usage++;
            
            updateUsageBar(usage);
            power -= (usage * 0.15);
            document.getElementById('power-val').innerText = Math.floor(power);
            
            if (power <= 0) endGame("POWER OUTAGE... SE CORTÓ LA LUZ.");
        }, 1000);

        // Reloj
        setInterval(() => {
            if (!gameActive) return;
            hour++;
            document.getElementById('clock').innerText = (hour === 0 ? 12 : hour) + " AM";
            if (hour === 6) victory();
        }, 40000);

        // IA Piloto (Max Verstappen nocturno)
        setInterval(() => {
            if (!gameActive) return;
            if (Math.random() > 0.5) {
                pilotPos++;
                updateCamVisuals();
            }
            if (pilotPos >= 4) {
                if (doorClosed && !tabletUp) {
                    pilotPos = 0; // Se va
                    updateCamVisuals();
                } else {
                    jumpscare();
                }
            }
        }, 5000);

        function toggleTablet() {
            if (!gameActive) return;
            tabletUp = !tabletUp;
            document.getElementById('tablet').classList.toggle('up', tabletUp);
            document.getElementById('tablet-trigger').innerText = tabletUp ? "▲ CLOSE ▲" : "▼ MONITOR ▼";
        }

        function toggleDoor() {
            if (!gameActive || tabletUp) return;
            doorClosed = !doorClosed;
            document.getElementById('door').classList.toggle('door-open', !doorClosed);
            document.getElementById('door-led').classList.toggle('active', doorClosed);
        }

        function setCam(n, btn) {
            currentCam = n;
            document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('cam-name').innerText = "CAM " + n + (n===1?": PIT LANE":n===2?": CORNER 1":": STRAIGHT");
            updateCamVisuals();
        }

        function updateCamVisuals() {
            const p = document.getElementById('pilot-cam');
            p.style.opacity = "0";
            if (currentCam === pilotPos) {
                p.style.opacity = "0.3";
                p.style.left = Math.random() * 50 + "%";
                p.style.top = Math.random() * 50 + "%";
            }
        }

        function updateUsageBar(n) {
            const bar = document.getElementById('usage-bar');
            bar.innerHTML = '';
            for(let i=0; i<n; i++) {
                let b = document.createElement('div');
                b.className = 'usage-block';
                if(n > 2) b.style.background = 'red';
                bar.appendChild(b);
            }
        }

        function jumpscare() {
            gameActive = false;
            document.getElementById('tablet').classList.remove('up');
            const sc = document.getElementById('pilot-scare');
            sc.style.opacity = "1";
            sc.style.transform = "scale(3)";
            setTimeout(() => {
                alert("GAME OVER: EL PILOTO TE ATRAPÓ");
                location.reload();
            }, 500);
        }

        function victory() {
            gameActive = false;
            alert("6 AM - ¡GANASTE! Sobreviviste al Gran Premio nocturno.");
            location.reload();
        }

        function endGame(m) {
            gameActive = false;
            document.getElementById('office').style.background = "#000";
            document.getElementById('door').style.display = "none";
            setTimeout(() => { alert(m); location.reload(); }, 2000);
        }
    </script>
</body>
</html>
