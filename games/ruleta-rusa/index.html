<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UdP3 2. Problemas de ecuaciones de primer grado. | TopWorksheets</title>
    <style>
        :root { --p1: #00f2ff; --bot: #bd00ff; --danger: #ff003c; --bg: #050505; }
        body {
            font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; text-transform: uppercase; overflow: hidden;
        }

        /* HUD */
        .hud { display: flex; gap: 20px; margin-bottom: 20px; }
        .box { padding: 15px; border: 2px solid #222; background: rgba(255,255,255,0.02); min-width: 150px; text-align: center; transition: 0.3s; }
        .p1.active { border-color: var(--p1); box-shadow: 0 0 15px var(--p1); }
        .bot.active { border-color: var(--bot); box-shadow: 0 0 15px var(--bot); }
        .score { font-size: 2rem; font-weight: bold; display: block; }
        .reloads { font-size: 0.7rem; color: #888; }

        /* Pistola */
        .gun-system { position: relative; width: 300px; height: 160px; margin: 20px; transition: transform 0.1s; }
        .part { position: absolute; background: #151515; border: 2px solid #333; }
        .h { width: 40px; height: 80px; right: 50px; top: 70px; transform: skewX(-15deg); }
        .b { width: 160px; height: 50px; right: 50px; top: 30px; border-radius: 5px; }
        .ba { width: 90px; height: 30px; left: 10px; top: 40px; background: #0a0a0a; border-radius: 5px 0 0 5px; }
        .cyl { 
            position: absolute; right: 100px; top: 35px; width: 40px; height: 40px; 
            border-radius: 50%; border: 3px dashed #555; display: flex; align-items: center; justify-content: center;
            transition: 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        /* Controles */
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 320px; }
        button {
            padding: 12px; font-weight: bold; cursor: pointer; border: 2px solid #444;
            background: transparent; color: white; transition: 0.2s; font-size: 0.8rem;
        }
        button:hover:not(:disabled) { background: white; color: black; border-color: white; }
        button:disabled { opacity: 0.2; cursor: not-allowed; }
        .primary { grid-column: span 2; border-color: var(--danger); color: var(--danger); }
        .primary:hover:not(:disabled) { background: var(--danger); color: white; }
        
        #status { margin-top: 20px; color: #666; letter-spacing: 2px; font-size: 0.9rem; }
        .shake { animation: shake 0.2s ease-in-out; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(15px) rotate(-5deg); } 75% { transform: translateX(-5px); } }
    </style>
</head>
<body>

    <div class="hud">
        <div id="p1-card" class="box p1 active">
            <span>HUMANO</span>
            <span id="p1-score" class="score">0</span>
            <div class="reloads">RECARGAS: <span id="p1-rem">3</span>/3</div>
        </div>
        <div id="bot-card" class="box bot">
            <span>BOT-X</span>
            <span id="bot-score" class="score">0</span>
            <div class="reloads">RECARGAS: <span id="bot-rem">3</span>/3</div>
        </div>
    </div>

    <div id="gun" class="gun-system">
        <div class="part h"></div>
        <div class="part b"></div>
        <div class="part ba"></div>
        <div id="cylinder" class="cyl">?</div>
    </div>

    <div class="actions">
        <button id="btn-fire-bot" class="primary" onclick="handleAction('attack')">DISPARAR AL BOT</button>
        <button id="btn-fire-self" onclick="handleAction('self')">DISPARARME</button>
        <button id="btn-reload" onclick="handleAction('reload')">RECARGAR</button>
    </div>

    <div id="status">SISTEMA INICIADO... TU TURNO</div>

    <script>
        let bullet = Math.floor(Math.random() * 6);
        let pos = 0;
        let turn = "p1";
        let active = true;
        let data = {
            p1: { score: 0, reloads: 3 },
            bot: { score: 0, reloads: 3 }
        };

        const audio = new (window.AudioContext || window.webkitAudioContext)();
        function playSnd(f, type='square', d=0.1) {
            const o = audio.createOscillator(); const g = audio.createGain();
            o.type = type; o.frequency.setValueAtTime(f, audio.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, audio.currentTime + d);
            o.connect(g); g.connect(audio.destination);
            o.start(); o.stop(audio.currentTime + d);
        }

        function handleAction(type) {
            if (!active || turn !== "p1") return;
            
            if (type === 'reload') {
                if (data.p1.reloads > 0) {
                    data.p1.reloads--;
                    document.getElementById('p1-rem').innerText = data.p1.reloads;
                    resetDrum("HAS RECARGADO EL TAMBOR");
                    endTurn();
                }
            } else {
                executeShot(type === 'attack' ? 'bot' : 'p1');
            }
        }

        function executeShot(target) {
            const gun = document.getElementById('gun');
            gun.classList.remove('shake'); void gun.offsetWidth; gun.classList.add('shake');
            document.getElementById('cylinder').style.transform = `rotate(${(pos+1)*360}deg)`;

            if (pos === bullet) {
                playSnd(80, 'sawtooth', 0.6);
                active = false;
                document.getElementById('status').innerText = target === 'p1' ? "TE HAS ELIMINADO" : "HAS ELIMINADO AL BOT";
                document.getElementById('cylinder').innerText = "💀";
                setTimeout(() => location.reload(), 3000);
            } else {
                playSnd(500, 'square', 0.05);
                document.getElementById('status').innerText = "CLIC... VACÍO";
                if (target === 'bot' || target === 'p1' && turn === 'p1') {
                    data[turn].score += 10;
                    document.getElementById(`${turn}-score`).innerText = data[turn].score;
                }
                pos++;
                endTurn();
            }
        }

        function resetDrum(msg) {
            bullet = Math.floor(Math.random() * 6);
            pos = 0;
            playSnd(300, 'sine', 0.2);
            document.getElementById('status').innerText = msg;
        }

        function endTurn() {
            if (!active) return;
            turn = turn === "p1" ? "bot" : "p1";
            document.getElementById('p1-card').classList.toggle('active');
            document.getElementById('bot-card').classList.toggle('active');
            
            const btns = document.querySelectorAll('button');
            btns.forEach(b => b.disabled = (turn === "bot"));

            if (turn === "bot") {
                document.getElementById('status').innerText = "EL BOT ESTÁ APUNTANDO...";
                setTimeout(botLogic, 1500);
            }
        }

        function botLogic() {
            const risk = pos / 6;
            // Si el riesgo es alto y tiene recargas, recarga.
            if (risk > 0.5 && data.bot.reloads > 0 && Math.random() > 0.4) {
                data.bot.reloads--;
                document.getElementById('bot-rem').innerText = data.bot.reloads;
                resetDrum("EL BOT HA RECARGADO");
                endTurn();
            } else {
                // El bot decide dispararte a ti (70%) o a sí mismo (30%)
                const target = Math.random() > 0.3 ? 'p1' : 'bot';
                document.getElementById('status').innerText = target === 'p1' ? "EL BOT TE DISPARA..." : "EL BOT SE ARRIESGA...";TT
                setTimeout(() => executeShot(target), 1000);
            }
        }
    </script>
</body>
</html>
