<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>UdP5 12. Ángulos y rectas | TopWorksheets</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #2c3e50;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            flex-direction: column;
        }
        /* Estilo del tablero tipo pasto */
        canvas {
            border: 8px solid #5d4037; /* Color tierra para el borde */
            border-radius: 10px;
            background-color: #7db131; /* Verde pasto */
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .score { 
            font-size: 28px; 
            margin-bottom: 15px; 
            background: rgba(0,0,0,0.3);
            padding: 5px 20px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <div class="score" id="scoreBoard">Puntos: 0</div>
    <canvas id="snakeGame" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById("snakeGame");
        const ctx = canvas.getContext("2d");
        const scoreBoard = document.getElementById("scoreBoard");

        const box = 25; 
        let score = 0;
        let d;
        
        let snake = [{ x: 8 * box, y: 10 * box }];
        let food = {
            x: Math.floor(Math.random() * 15 + 1) * box,
            y: Math.floor(Math.random() * 15 + 1) * box
        };

        document.addEventListener("keydown", direction);

        function direction(event) {
            if(event.keyCode == 37 && d != "RIGHT") d = "LEFT";
            else if(event.keyCode == 38 && d != "DOWN") d = "UP";
            else if(event.keyCode == 39 && d != "LEFT") d = "RIGHT";
            else if(event.keyCode == 40 && d != "UP") d = "DOWN";
        }

        function draw() {
            // Dibujar el fondo verde (pasto)
            ctx.fillStyle = "#7db131";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Dibujar cuadrícula suave
            ctx.strokeStyle = "rgba(0,0,0,0.05)";
            for(let i=0; i<canvas.width; i+=box) {
                ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke();
            }

            // Dibujar serpiente
            for(let i = 0; i < snake.length; i++) {
                ctx.font = "20px Arial";
                // Cabeza 🐍 y cuerpo 🟢
                ctx.fillText(i == 0 ? "🐍" : "🟢", snake[i].x, snake[i].y + box/1.2);
            }

            // Dibujar manzana 🍎
            ctx.font = "20px Arial";
            ctx.fillText("🍎", food.x, food.y + box/1.2);

            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if( d == "LEFT") snakeX -= box;
            if( d == "UP") snakeY -= box;
            if( d == "RIGHT") snakeX += box;
            if( d == "DOWN") snakeY += box;

            if(snakeX == food.x && snakeY == food.y) {
                score++;
                scoreBoard.innerHTML = "Puntos: " + score;
                food = {
                    x: Math.floor(Math.random() * 15 + 1) * box,
                    y: Math.floor(Math.random() * 15 + 1) * box
                };
            } else {
                snake.pop();
            }

            let newHead = { x: snakeX, y: snakeY };

            if(snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) {
                clearInterval(game);
                alert("¡Juego Terminado! Puntuación: " + score);
                location.reload();
            }

            snake.unshift(newHead);
        }

        function collision(head, array) {
            for(let i = 0; i < array.length; i++) {
                if(head.x == array[i].x && head.y == array[i].y) return true;
            }
            return false;
        }

        // Velocidad lenta (200ms)
        let game = setInterval(draw, 200);
    </script>
</body>
</html>
