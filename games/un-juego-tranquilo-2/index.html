<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SYSTEM DIAGNOSTICS</title>

<style>
body {
  margin: 0;
  background: #0b0f14;
  color: #00ff99;
  font-family: monospace;
  overflow: hidden;
}

/* barra */
#bar {
  position: absolute;
  top: 20px;
  left: 20px;
  width: 320px;
  height: 18px;
  border: 1px solid #00ff99;
}

#fill {
  width: 0%;
  height: 100%;
  background: #00ff99;
  transition: width 0.2s;
}

/* terminal */
#terminal {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 35%;
  background: #000;
  padding: 10px;
  overflow: hidden;
  font-size: 13px;
}

/* cámara */
#camera {
  position: absolute;
  top: 80px;
  right: 20px;
  width: 260px;
  height: 160px;
  border: 1px solid #00ff99;
  background: #111;
  overflow: hidden;
}

#face {
  position: absolute;
  width: 60px;
  height: 60px;
  border: 2px solid #00ff99;
}

/* mapa */
#map {
  position: absolute;
  top: 80px;
  left: 360px;
  width: 260px;
  height: 160px;
  border: 1px solid #00ff99;
}

#map iframe {
  width: 100%;
  height: 100%;
  border: none;
  filter: hue-rotate(90deg) contrast(1.2);
}

/* ventanas */
.window {
  position: absolute;
  width: 240px;
  height: 140px;
  background: rgba(10,10,10,0.95);
  border: 1px solid #333;
  padding: 10px;
  color: #ccc;
  font-size: 12px;
  box-shadow: 0 0 15px rgba(0,255,153,0.2);
  animation: fadeIn 0.3s ease-in;
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

/* 🚨 POPUP SISTEMA UI */
#popup {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: 320px;
  background: rgba(20,20,20,0.95);
  border: 1px solid #ff0033;
  color: #ff4d4d;
  padding: 12px;
  font-size: 13px;
  box-shadow: 0 0 15px rgba(255,0,0,0.3);
  display: none;
  z-index: 9999;
  animation: popIn 0.3s ease-out;
}

@keyframes popIn {
  from { transform: translateX(-50%) scale(0.8); opacity: 0; }
  to { transform: translateX(-50%) scale(1); opacity: 1; }
}
</style>
</head>

<body>

<div id="bar"><div id="fill"></div></div>

<div id="camera">
  📷 LIVE SCAN
  <div id="face"></div>
</div>

<div id="map">
  <iframe id="mapFrame"></iframe>
</div>

<div id="terminal"></div>

<!-- POPUP -->
<div id="popup">
  ⚠ SISTEMA UI no responde<br>
  <small>Intentando restaurar interfaz...</small>
</div>

<script>
const fill = document.getElementById("fill");
const terminal = document.getElementById("terminal");
const face = document.getElementById("face");
const mapFrame = document.getElementById("mapFrame");
const popup = document.getElementById("popup");

let progress = 0;

/* 🚀 AUTO START */
init();

function init() {
  systemBar();
  logs();
  faceTrack();
  mapLoop();
  windows();
  popupLoop();
}

/* 📊 barra */
function systemBar() {
  setInterval(() => {
    progress += Math.random() * 4;
    if (progress > 100) progress = 100;
    fill.style.width = progress + "%";
  }, 250);
}

/* 💻 terminal */
function logs() {
  const msgs = [
    "[OK] Boot sequence initialized...",
    "[OK] Kernel modules loaded...",
    "[WARN] UI latency detected...",
    "[OK] Scanning environment...",
    "[OK] Mapping digital footprint...",
    "[DONE] System diagnostics running..."
  ];

  let i = 0;
  setInterval(() => {
    terminal.innerHTML += msgs[i % msgs.length] + "<br>";
    terminal.scrollTop = terminal.scrollHeight;
    i++;
  }, 450);
}

/* 📷 tracking */
function faceTrack() {
  setInterval(() => {
    face.style.left = Math.random() * 180 + "px";
    face.style.top = Math.random() * 90 + "px";
  }, 350);
}

/* 🌍 mapa */
function mapLoop() {
  setInterval(() => {
    let lat = (Math.random()*180-90);
    let lon = (Math.random()*360-180);
    mapFrame.src = `https://maps.google.com/maps?q=${lat},${lon}&z=14&output=embed`;
  }, 3000);
}

/* 🪟 ventanas */
function windows() {
  for (let i = 0; i < 6; i++) {
    setTimeout(() => {
      const w = document.createElement("div");
      w.className = "window";
      w.style.left = Math.random()*window.innerWidth + "px";
      w.style.top = Math.random()*window.innerHeight + "px";

      w.innerHTML = `
        <b>SYSTEM ALERT</b><br><br>
        UI instability detected...<br>
        Re-routing processes...
      `;

      document.body.appendChild(w);
    }, i * 600);
  }
}

/* 🚨 POPUP LOOP */
function popupLoop() {
  setTimeout(showPopup, 1500);
  setInterval(showPopup, 8000);
}

function showPopup() {
  popup.style.display = "block";

  setTimeout(() => {
    popup.style.display = "none";
  }, 4000);
}
</script>

</body>
</html>
